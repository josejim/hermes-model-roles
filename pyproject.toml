[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "hermes-model-roles"
version = "1.0.0"
description = "Centralized model roles and anti-drift guard for Hermes Agent"
readme = "README.md"
license = "MIT"
authors = [{ name = "Jose Jimenez" }]
requires-python = ">=3.10"
dependencies = [
    "pyyaml>=6.0",
]

[project.scripts]
hermes-model-roles = "hermes_model_roles.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
